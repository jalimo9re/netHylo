name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Backend typecheck
        run: npm run typecheck --prefix backend

      - name: Backend unit tests
        run: npm run test --prefix backend -- --runInBand

      - name: Backend e2e tests
        run: npm run test:e2e:report --prefix backend

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend

      - name: Frontend unit tests
        run: npm run test:ci --prefix frontend

      - name: Frontend build (development)
        run: npm run build --prefix frontend -- --configuration development --output-path dist-ci
